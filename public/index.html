<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GenUI Chat</title>
  
  <!-- Tailwind CSS Play CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Markdown & Highlight.js -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  
  <style>
    /* Custom scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { background: #52525b; border-radius: 4px; }
    
    /* Styling khusus untuk output Markdown (marked.js) */
    .prose pre { 
      background: #18181b !important; 
      padding: 1rem; 
      border-radius: 0.5rem; 
      overflow-x: auto; 
      border: 1px solid #27272a;
    }
    .prose code { 
      font-family: 'Fira Code', monospace; 
      font-size: 0.875rem; 
      background: #27272a;
      padding: 0.2rem 0.4rem;
      border-radius: 0.25rem;
    }
    .prose pre code {
      background: transparent;
      padding: 0;
    }
    .prose p { margin-bottom: 1rem; line-height: 1.6; }
    .prose ul { list-style-type: disc; padding-left: 1.5rem; margin-bottom: 1rem; }
    .prose ol { list-style-type: decimal; padding-left: 1.5rem; margin-bottom: 1rem; }
    .prose h1, .prose h2, .prose h3 { font-weight: bold; margin-top: 1.5rem; margin-bottom: 0.75rem; }
  </style>
</head>
<body class="bg-zinc-950 text-zinc-50 h-screen flex overflow-hidden font-sans">

  <!-- LOGIN MODAL -->
  <div id="login-modal" class="absolute inset-0 bg-zinc-950 flex items-center justify-center z-50 hidden">
    <div class="bg-zinc-900 p-8 rounded-2xl shadow-xl w-96 border border-zinc-800">
      <h1 class="text-2xl font-bold mb-6 text-center">GenUI Chat</h1>
      <form id="login-form" class="space-y-4">
        <div>
          <label class="block text-sm text-zinc-400 mb-1">Email</label>
          <input type="email" id="login-email" autocomplete="email" class="w-full bg-zinc-800 text-white rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500" required>
        </div>
        <div>
          <label class="block text-sm text-zinc-400 mb-1">Password</label>
          <input type="password" id="login-password" autocomplete="current-password" class="w-full bg-zinc-800 text-white rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500" required>
        </div>
        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 rounded-lg transition-colors">Login / Register</button>
        <p id="login-error" class="text-red-400 text-sm text-center hidden"></p>
      </form>
    </div>
  </div>

  <!-- SIDEBAR -->
  <aside class="w-64 bg-zinc-900 border-r border-zinc-800 flex flex-col hidden md:flex">
    <div class="p-4 border-b border-zinc-800 flex justify-between items-center">
      <h2 class="font-bold text-lg">Sessions</h2>
      <button id="new-chat-btn" class="bg-indigo-600 hover:bg-indigo-700 p-1.5 rounded-md transition-colors" title="New Chat">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
      </button>
    </div>
    <div id="session-list" class="flex-1 overflow-y-auto p-2 space-y-1">
      <!-- Session items -->
    </div>
    <div class="p-4 border-t border-zinc-800">
      <button id="logout-btn" class="text-sm text-zinc-400 hover:text-white transition-colors">Logout</button>
    </div>
  </aside>

  <!-- MAIN CHAT AREA -->
  <main class="flex-1 flex flex-col relative h-full bg-zinc-950">
    <!-- Header -->
    <header class="h-14 border-b border-zinc-800 flex items-center px-6 bg-zinc-950/80 backdrop-blur-md sticky top-0 z-10">
      <h1 id="current-session-title" class="font-semibold text-zinc-200">New Chat</h1>
    </header>

    <!-- Chat Messages -->
    <div id="chat-container" class="flex-1 overflow-y-auto p-4 md:p-8 space-y-6">
      <div class="text-center text-zinc-500 mt-10" id="empty-state">
        <p>Mulai percakapan baru dengan GenUI.</p>
        <p class="text-sm mt-2">Coba: "Buatkan tabel perbandingan 3 framework JS" atau "Buat file README.md"</p>
      </div>
    </div>

    <!-- Input Area -->
    <div class="p-4 bg-zinc-950 border-t border-zinc-800">
      <div class="max-w-4xl mx-auto relative bg-zinc-900 border border-zinc-700 rounded-xl overflow-hidden shadow-lg focus-within:ring-2 focus-within:ring-indigo-500 transition-all">
        <div id="attachment-preview" class="hidden p-2 gap-2 flex-wrap bg-zinc-800/50 border-b border-zinc-700"></div>
        
        <textarea id="chat-input" rows="1" class="w-full bg-transparent text-white px-4 py-3 resize-none focus:outline-none placeholder-zinc-500" placeholder="Ketik pesan atau perintah..."></textarea>
        
        <div class="flex items-center justify-between px-2 pb-2">
          <div class="flex items-center gap-2">
            <label class="cursor-pointer p-2 text-zinc-400 hover:text-white rounded-lg hover:bg-zinc-800 transition-colors">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13"></path></svg>
              <input type="file" id="file-upload" class="hidden" multiple>
            </label>
          </div>
          <button id="send-btn" class="bg-indigo-600 hover:bg-indigo-700 text-white p-2 rounded-lg transition-colors disabled:opacity-50">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
          </button>
        </div>
      </div>
    </div>
  </main>

  <script src="/app.js"></script>
</body>
</html>
